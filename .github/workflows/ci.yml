name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HTML, data and translation checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install html-validate
        run: npm install --no-audit --no-fund

      - name: Validate HTML (prototype and landing page)
        run: npm run lint:html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          for f in data/*.json; do
            python -m json.tool "$f" > /dev/null && echo "valid JSON: $f"
          done

      - name: Dataset, PII, CSV, translation parity and offline checks
        run: python tools/validate.py
